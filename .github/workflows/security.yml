name: Dependency audit

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - requirements.txt
      - .github/workflows/security.yml
  pull_request:
    paths:
      - pyproject.toml
      - requirements.txt
      - .github/workflows/security.yml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit resolved runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies and the vulnerability scanner
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,examples,notebooks,metrics]"
          python -m pip install pip-audit==2.10.1

      - name: Audit resolved runtime dependencies
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off

      - name: Audit the installed development environment
        run: pip-audit --local --skip-editable --progress-spinner off
