name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,examples]"

      - name: Run unit, scientific-sanity, and notebook-smoke tests
        run: python -m pytest -p no:cacheprovider

  package:
    name: Distribution and wheel install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release-check tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build==1.3.0 twine==6.2.0 cffconvert==2.0.0

      - name: Validate citation metadata
        run: cffconvert --validate

      - name: Build and check distributions
        run: |
          test ! -e dist
          python -m build
          python -m twine check dist/*

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          archives = sorted(Path("dist").iterdir())
          if len(archives) != 2:
              raise SystemExit(f"expected two distributions, found: {archives}")

          forbidden = {
              "PUBLIC_RELEASE_AUDIT.md",
              "PUBLIC_RELEASE_PLAN.md",
          }
          forbidden_suffixes = {
              ".ckpt",
              ".log",
              ".pth",
              ".pt",
              ".pyc",
          }

          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as wheel:
                      names = wheel.namelist()
              else:
                  with tarfile.open(archive, "r:gz") as source:
                      names = source.getnames()

              for name in names:
                  path = Path(name)
                  if path.name in forbidden or path.suffix in forbidden_suffixes:
                      raise SystemExit(f"forbidden distribution entry: {name}")
                  if "__pycache__" in path.parts or ".pytest_cache" in path.parts:
                      raise SystemExit(f"cache entry in distribution: {name}")
          PY

      - name: Install and import the wheel in a fresh environment
        run: |
          python -m venv /tmp/convmmd-wheel-check
          /tmp/convmmd-wheel-check/bin/python -m pip install --upgrade pip
          /tmp/convmmd-wheel-check/bin/python -m pip install dist/convmmd-0.2.0-py3-none-any.whl
          /tmp/convmmd-wheel-check/bin/python -m pip check
          cd /tmp
          /tmp/convmmd-wheel-check/bin/python -c "import convMMD, importlib.metadata; assert convMMD.__version__ == '0.2.0'; assert importlib.metadata.version('convMMD') == '0.2.0'"
